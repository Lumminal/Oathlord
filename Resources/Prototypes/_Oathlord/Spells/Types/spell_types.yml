# Spell Types
#
# Here we store all spell types.
# A spell type defines in which category a spell belongs to.
# Usually, a spellcasting item must meet the spell types of a spell in order to cast it
#
# Do not bloat spell types, spell types should be part of Magic Research and have a major impact
# Make sure to add edgy lore or something, if you're adding new spell types

