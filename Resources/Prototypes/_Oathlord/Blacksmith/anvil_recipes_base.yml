# An anvil recipe is a prototype that gets called by the anvil, when the user requests them.
#
# Recipes are not tied to metals, nor the anvil.
#
# Here's an example recipe to show you how you can make one:
#
# - type: anvilRecipe
#   id: SimpleAnvilRecipe
#   metals: [ MyMetal ] -> This is an entity representing your metal
#   workRequired: 60    -> This is the final number the user must reach via hitting the anvil with a hammer
#   result: MyItem   -> This is the result of the recipe
#
# You can also make combinations:
#
# - type: anvilRecipe
#   id: SimpleAnvilRecipe
#   metals: [ MyMetal, MyOtherMetal, MyOtherOtherMetal ] -> This recipe will require those metals in order to show up
#
# For more advanced recipes, you can add patterns. Patterns are a sequence of numbers the user must "hit" before succeeding the recipe.
# This means, even if they reach the work required, they won't be able to complete the recipe unless they do the pattern
#
# - type: anvilRecipe
#   id: SimpleAnvilRecipe
#   metals: [ MyMetal ]
#   workRequired: 65
#   pattern: [ 5, -5, 5 ] -> The player must hit those numbers in the correct sequence, with the last one adding up to 65
#
# You must make the numbers in the pattern exist in the anvil's hit numbers (depending on the anvil).
#
# Use this file to add BASE recipes. If you want to add recipes for a material, then create a base for it and
# create a new file called "anvil_recipes_X.yml" where X is the material's name (e.g. silver)
#
# - type: anvilRecipe
#   id: SilverMetalAnvilRecipeBase
#   metals: [ SilverMetal ]
#
# Then in "anvil_recipes_silver.yml"
#
# - type: anvilRecipe
#   parents: SilverMetalAnvilRecipeBase
#   id: SilverMetalAnvilScrew
#
# If you need to create combinations of recipes, then make a new file called "anvil_recipes_XY.yml" where X and Y are the starting letters of the materials.
#
# e.g. "anvil_recipes_gs" means recipes that combine Gold and Silver.
#
# And remember, an anvil recipe must create PARTS of items, not items.
# You shouldn't get a sword via an anvil, you should get a sword blade instead, which can then be assembled into a sword.
- type: anvilRecipe
  id: DebugAnvilRecipe
  metals: [ DebugWorkable ]
  workRequired: 10
  result: Throngler
